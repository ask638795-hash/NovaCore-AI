<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NovaCore AI - We Build Future with AI</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  <style>
    :root {
      --neon: #00ffff;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #0a0a1f;
      color: white;
    }

    /* Navbar */
    .navbar {
      position: fixed;
      top: 0;
      width: 100%;
      background: rgba(10, 10, 31, 0.95);
      backdrop-filter: blur(10px);
      z-index: 1000;
      border-bottom: 1px solid var(--neon);
    }
    .nav-container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 15px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .logo { font-size: 28px; font-weight: bold; }
    .neon { color: var(--neon); text-shadow: 0 0 10px var(--neon); }

    /* Hero */
    .hero {
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      background: linear-gradient(135deg, #0a0a1f, #1a0033);
    }
    .hero h1 {
      font-size: 4rem;
      margin-bottom: 20px;
    }
    .neon-text { color: var(--neon); text-shadow: 0 0 20px var(--neon); }

    /* Chatbot */
    .chat-toggle-btn {
      position: fixed;
      bottom: 30px;
      right: 30px;
      background: linear-gradient(45deg, #00ffff, #0088ff);
      color: black;
      border: none;
      padding: 15px 25px;
      border-radius: 50px;
      font-weight: bold;
      box-shadow: 0 0 25px rgba(0, 255, 255, 0.7);
      z-index: 2000;
      cursor: pointer;
    }
    .chatbot-window {
      display: none;
      position: fixed;
      bottom: 90px;
      right: 20px;
      width: 380px;
      height: 550px;
      background: #0f0f1f;
      border-radius: 20px;
      border: 2px solid var(--neon);
      box-shadow: 0 0 40px rgba(0, 255, 255, 0.6);
      overflow: hidden;
      z-index: 2001;
    }
    .chat-header {
      background: linear-gradient(90deg, #00ffff, #0066ff);
      color: black;
      padding: 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: bold;
    }
    .chat-messages {
      height: 410px;
      overflow-y: auto;
      padding: 15px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      background: #111122;
    }
    .message {
      padding: 12px 16px;
      border-radius: 18px;
      max-width: 85%;
    }
    .user-message {
      align-self: flex-end;
      background: #00ffff;
      color: black;
    }
    .ai-message {
      align-self: flex-start;
      background: #1e1e2e;
      color: #00ffcc;
    }
    .chat-input-area {
      padding: 12px;
      background: #0a0a1f;
      display: flex;
      gap: 8px;
    }
    #user-input {
      flex: 1;
      padding: 12px 18px;
      border-radius: 30px;
      border: 1px solid var(--neon);
      background: #1a1a2e;
      color: white;
    }
    #send-btn {
      padding: 0 25px;
      background: var(--neon);
      color: black;
      border: none;
      border-radius: 30px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar">
    <div class="nav-container">
      <h1 class="logo">NovaCore <span class="neon">AI</span></h1>
      <div>Home  Services  About</div>
    </div>
  </nav>

  <!-- Hero -->
  <section class="hero">
    <h1>We Build <span class="neon-text">Future</span> with AI</h1>
    <p style="font-size: 1.3rem; margin: 20px 0;">Intelligent solutions for modern businesses</p>
    <button class="chat-toggle-btn" id="chat-toggle">
      <i class="fas fa-robot"></i> Chat with NovaCore AI
    </button>
  </section>

  <!-- Chatbot Window -->
  <div id="chatbot-window" class="chatbot-window">
    <div class="chat-header">
      <h3>NovaCore AI</h3>
      <button id="chat-close">✕</button>
    </div>
    <div id="chat-messages" class="chat-messages"></div>
    <div class="chat-input-area">
      <input type="text" id="user-input" placeholder="Ask anything...">
      <button id="send-btn">Send</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>                                                                                             </html>
